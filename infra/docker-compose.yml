version: "3.9"

services:
  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4
    container_name: satquery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery_dev
      POSTGRES_DB: satquery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: satquery_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery_backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://satquery:satquery_dev@db:5432/satquery_db
      DATABASE_URL_SYNC: postgresql://satquery:satquery_dev@db:5432/satquery_db
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: satquery-uploads
      INFERENCE_DEVICE: cpu
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # Hot reload in development
      - ./ml:/app/ml            # Mount model registry and cache
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  minio_data:
